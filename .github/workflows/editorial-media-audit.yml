name: Editorial media audit

on:
  push:
    branches:
      - main
      - feat/editorial-media-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        id: setup
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile
      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Resolution self-test
        id: selftest
        continue-on-error: true
        run: bun run test:editorial-images
      - name: Openverse discovery pilot (best effort)
        id: discover
        continue-on-error: true
        run: bun run media:discover --limit 3
      - name: Reconcile originals against local media
        id: reconcile
        continue-on-error: true
        run: bun run media:reconcile
      - name: Audit editorial images
        id: audit
        continue-on-error: true
        run: bun run audit:editorial-images
      - name: Format editorial media files
        id: format
        continue-on-error: true
        run: >-
          bunx prettier --write scripts/audit-editorial-images.ts scripts/editorial-media-lib.ts
          scripts/reconcile-editorial-images.ts scripts/discover-editorial-images.ts
          scripts/approve-editorial-media.ts scripts/test-editorial-image-resolution.ts
          src/features/editorial/images.ts src/features/editorial/media-storage.ts
          src/features/editorial/media-types.ts
      - name: Lint editorial media files
        id: lint
        continue-on-error: true
        run: >-
          bunx eslint scripts/audit-editorial-images.ts scripts/editorial-media-lib.ts
          scripts/reconcile-editorial-images.ts scripts/discover-editorial-images.ts
          scripts/approve-editorial-media.ts scripts/test-editorial-image-resolution.ts
          src/features/editorial/images.ts src/features/editorial/media-storage.ts
          src/features/editorial/media-types.ts
      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Record CI status
        if: always()
        run: |
          mkdir -p docs/editorial-media
          cat > docs/editorial-media/ci-status.json <<EOF
          {
            "ranAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "setup": "${{ steps.setup.outcome }}",
            "install": "${{ steps.install.outcome }}",
            "typecheck": "${{ steps.typecheck.outcome }}",
            "selftest": "${{ steps.selftest.outcome }}",
            "discover": "${{ steps.discover.outcome }}",
            "reconcile": "${{ steps.reconcile.outcome }}",
            "audit": "${{ steps.audit.outcome }}",
            "format": "${{ steps.format.outcome }}",
            "lint": "${{ steps.lint.outcome }}",
            "build": "${{ steps.build.outcome }}"
          }
          EOF
      - name: Commit verification artifacts
        if: always() && github.ref == 'refs/heads/feat/editorial-media-recovery'
        continue-on-error: true
        run: |
          set +e
          git config user.name "nairaleap-verification-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/editorial/media
          git add -A docs/editorial-media
          git add -A src/data/editorialMediaApproved.ts
          git add -A scripts/audit-editorial-images.ts scripts/editorial-media-lib.ts
          git add -A scripts/reconcile-editorial-images.ts scripts/discover-editorial-images.ts
          git add -A scripts/approve-editorial-media.ts scripts/test-editorial-image-resolution.ts
          git add -A src/features/editorial/images.ts src/features/editorial/media-storage.ts
          git add -A src/features/editorial/media-types.ts
          git add -A public/editorial/media
          if git diff --staged --quiet; then
            echo "No verification artifacts to commit"
          else
            git commit -m "chore: editorial media verification artifacts [skip ci]"
            git push
          fi
      - name: Fail on step failures
        if: always()
        run: |
          if [ "${{ steps.setup.outcome }}" = "failure" ]; then echo "setup failed"; exit 1; fi
          if [ "${{ steps.install.outcome }}" = "failure" ]; then echo "install failed"; exit 1; fi
          if [ "${{ steps.typecheck.outcome }}" = "failure" ]; then echo "typecheck failed"; exit 1; fi
          if [ "${{ steps.selftest.outcome }}" = "failure" ]; then echo "selftest failed"; exit 1; fi
          if [ "${{ steps.discover.outcome }}" = "failure" ]; then echo "discover failed"; exit 1; fi
          if [ "${{ steps.reconcile.outcome }}" = "failure" ]; then echo "reconcile failed"; exit 1; fi
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then echo "audit failed"; exit 1; fi
          if [ "${{ steps.format.outcome }}" = "failure" ]; then echo "format failed"; exit 1; fi
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then echo "lint failed"; exit 1; fi
          if [ "${{ steps.build.outcome }}" = "failure" ]; then echo "build failed"; exit 1; fi
          echo "All editorial media verification steps passed."
