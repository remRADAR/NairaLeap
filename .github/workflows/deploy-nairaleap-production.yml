name: Deploy NairaLeap Production Site

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PRODUCTION to confirm deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nairaleap-production-deployment
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  deploy:
    name: Build and deploy live production Worker
    runs-on: ubuntu-latest
    environment: Preview

    steps:
      - name: Require explicit production confirmation
        if: ${{ inputs.confirmation != 'DEPLOY_PRODUCTION' }}
        run: |
          echo "Confirmation must be exactly DEPLOY_PRODUCTION."
          exit 1

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Require Supabase build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          VITE_SUPABASE_URL="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          VITE_SUPABASE_URL="${VITE_SUPABASE_URL%/}"
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          test "$VITE_SUPABASE_URL" = "https://odixzoveqjhovkgdcfta.supabase.co"

      - name: TypeScript validation
        run: bunx tsc --noEmit

      - name: Build Cloudflare artifact
        run: bun run build

      - name: Verify production Worker configuration
        shell: bash
        run: |
          test -f .output/server/wrangler.json
          test -f .output/server/index.mjs
          node <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync(".output/server/wrangler.json", "utf8"));
          const db = (config.d1_databases || []).find((entry) => entry.binding === "NAIRALEAP_DB");
          if (!db || db.database_name !== "nairaleap-data" || db.database_id !== "55e19c59-b032-4f56-b8bc-7b41985426f8") {
            throw new Error("Unexpected production D1 binding");
          }
          if (JSON.stringify(config.triggers?.crons || []) !== JSON.stringify(["*/5 * * * *"])) {
            throw new Error("Unexpected production cron configuration");
          }
          if (config.routes || config.route || config.domains) {
            throw new Error("Routes/domains are present; refusing to modify routing");
          }
          console.log("Verified production D1 binding, cron, and no route/domain changes.");
          NODE

      - name: Deploy to nairaleap-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9fc1498025cb46ee73d1f585bda0c8f
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config .output/server/wrangler.json --name nairaleap-site

      - name: Verify deployed Worker
        run: |
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 https://nairaleap.com/ -o /tmp/nairaleap-home.html
          grep -qi "NairaLeap" /tmp/nairaleap-home.html
